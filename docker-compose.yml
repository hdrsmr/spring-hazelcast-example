services:

  # =====================================================
  # SQL SERVER
  # =====================================================
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "chickhenR2#"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    restart: unless-stopped


  # =====================================================
  # HAZELCAST MULTI MEMBER CLUSTER
  # =====================================================
  hazelcast-1:
    image: hazelcast/hazelcast:5.6
    container_name: hazelcast-1
    ports:
      - "5701:5701"
    environment:
      HZ_CLUSTERNAME: dev
    networks:
      - hazelcast-network
    restart: unless-stopped

  hazelcast-2:
    image: hazelcast/hazelcast:5.6
    container_name: hazelcast-2
    ports:
      - "5702:5701"
    environment:
      HZ_CLUSTERNAME: dev
    networks:
      - hazelcast-network
    restart: unless-stopped

  hazelcast-3:
    image: hazelcast/hazelcast:5.6
    container_name: hazelcast-3
    ports:
      - "5703:5701"
    environment:
      HZ_CLUSTERNAME: dev
    networks:
      - hazelcast-network
    restart: unless-stopped


  # =====================================================
  # HAZELCAST MANAGEMENT CENTER
  # =====================================================
  management-center:
    image: hazelcast/management-center:5.6
    container_name: hazelcast-management
    ports:
      - "7070:8080"
    environment:
      MC_DEFAULT_CLUSTER: dev
      MC_DEFAULT_CLUSTER_MEMBERS: hazelcast-1:5701,hazelcast-2:5701,hazelcast-3:5701
    networks:
      - hazelcast-network
    depends_on:
      - hazelcast-1
      - hazelcast-2
      - hazelcast-3
    restart: unless-stopped

networks:
  hazelcast-network:
    driver: bridge


# =====================================================
# VOLUMES
# =====================================================
volumes:
  sqlserver_data: